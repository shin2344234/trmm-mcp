# Publish to PyPI when a version tag is pushed.
#
# No API token is involved. PyPI is configured to trust this specific
# repository + workflow, and GitHub mints a short-lived OIDC token for the job
# (hence `id-token: write`). Nothing long-lived exists to leak or to rotate.
#
# Release flow: bump the version, update CHANGELOG.md, tag `vX.Y.Z`, push the
# tag. This checks the tag agrees with pyproject.toml, runs the offline test
# suites, then publishes.

name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tag must match the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag packaged=$packaged"
          if [ "$tag" != "$packaged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $packaged"
            exit 1
          fi

      - name: Test
        # Only suites that are genuinely self-contained: no network, no live
        # TacticalRMM, no running server, and no child process that would load
        # its own .env. protocol_test is deliberately excluded - it launches
        # run.sh as a subprocess and calls real tools, so it needs a live TRMM.
        env:
          TRMM_API_URL: https://example.invalid
          TRMM_READONLY_API_KEY: dummy
        run: |
          export TRMM_MCP_BASE_DIR="$(mktemp -d)"
          for suite in render_test config_test; do
            echo "--- $suite"
            python "$suite.py"
          done

      - name: Package imports and entry points resolve
        env:
          TRMM_API_URL: https://example.invalid
          TRMM_READONLY_API_KEY: dummy
        run: |
          export TRMM_MCP_BASE_DIR="$(mktemp -d)"
          pip install .
          python - <<'PY'
          import importlib.metadata as md
          import trmm_mcp
          print("version:", trmm_mcp.__version__)
          scripts = md.entry_points(group="console_scripts")
          mine = {e.name: e for e in scripts if e.module.startswith("trmm_mcp")}
          expected = {"trmm-mcp", "trmm-mcp-setup-auth",
                      "trmm-mcp-approve", "trmm-mcp-logs"}
          missing = expected - set(mine)
          assert not missing, f"entry points missing: {missing}"
          for name, entry in sorted(mine.items()):
              entry.load()
              print("  ok:", name)
          PY

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # required to mint the OIDC token PyPI verifies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the artifacts
        run: |
          pip install twine
          twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
